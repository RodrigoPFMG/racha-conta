name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unidade + integração com cobertura
        run: pytest tests/unit tests/integration --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Instalar navegador do Playwright
        if: hashFiles('tests/e2e/test_*.py') != ''
        run: python -m playwright install --with-deps chromium
      - name: Testes E2E
        if: hashFiles('tests/e2e/test_*.py') != ''
        run: pytest tests/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-${{ matrix.os }}
          path: coverage.xml
